<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GlamWithJeni app</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { min-height: 100%; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #EDE4EA; padding: 24px; box-sizing: border-box; }
  #dc-root > div { border-radius: 36px; box-shadow: 0 20px 60px rgba(42, 26, 46, 0.22); }
  @media (max-width: 440px) { body { padding: 0; align-items: flex-start; } #dc-root > div { border-radius: 0; box-shadow: none; } }
</style>
<script src="vendor/preact.umd.js"></script>
<script src="dc-lite.js"></script>
</head>
<body>
<template id="dc">
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Allura&amp;family=Outfit:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
input,textarea{font-family:inherit}
a{color:#B83A63}a:hover{color:#8E2A4B}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FCF8F9; color: #2A1A2E; font-family: 'Manrope', sans-serif; font-size: 15px; overflow: hidden">

<sc-if value="{{isLogin}}" hint-placeholder-val="{{ true }}">
<div style="flex: 1; display: flex; flex-direction: column; padding: 56px 28px 28px; gap: 26px">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="width: 64px; height: 64px; border-radius: 16px; background: #5B2A5E; display: flex; align-items: center; justify-content: center"><span aria-hidden="true" style="font-family: 'Allura', cursive; font-size: 56px; line-height: 1; color: #FFFFFF; margin-top: 6px">J</span></div>
<h1 aria-label="GlamWithJeni" style="margin: 18px 0 0; display: flex; flex-direction: column; font-weight: 400"><span style="font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 7px; color: #5B2A5E">GLAM WITH</span><span style="font-family: 'Allura', cursive; font-size: 84px; line-height: 0.95; color: #B83A63">Jeni</span></h1>
<p style="margin: 0; color: #6E5E6A; font-size: 16px; line-height: 1.5">Makeup, nail art and press-on nails. Log in with your mobile number to book and order.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="phone" style="font-weight: 600; font-size: 14px">Mobile number</label>
<div style="display: flex; align-items: center; border: 1px solid #D9C7CF; border-radius: 14px; background: #FFFFFF; height: 56px; overflow: hidden">
<span style="padding: 0 14px; font-weight: 600; border-right: 1px solid #EADDE3; height: 100%; display: flex; align-items: center">+91</span>
<input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="98765 43210" value="{{phone}}" onChange="{{onPhone}}" style="flex: 1; border: 0; outline: none; padding: 0 14px; font-size: 17px; background: transparent; min-width: 0">
</div>
<p style="margin: 0; color: #6E5E6A; font-size: 13px">We'll text you a one-time code.</p>
</div>
<button onClick="{{sendOtp}}" style="height: 54px; border: 0; border-radius: 14px; background: #B83A63; color: #FFFFFF; font-size: 16px; font-weight: 700">Send OTP</button>
<div style="background: #F1E6EB; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #5B4A57; line-height: 1.45">Prototype tip: Jeni's number opens the admin screens. Any other number opens the customer app.</span>
<button onClick="{{fillAdmin}}" style="align-self: flex-start; height: 36px; padding: 0 12px; border: 1px solid #B9A6B0; border-radius: 10px; background: #FFFFFF; color: #2A1A2E; font-weight: 700; font-size: 13px">Use Jeni's number (99999 99999)</button>
</div>
<div style="flex: 1"></div>
<p style="margin: 0; text-align: center; color: #6E5E6A; font-size: 12px; line-height: 1.5">By continuing you agree to receive booking updates and offers on WhatsApp. You can opt out anytime.</p>
</div>
</sc-if>

<sc-if value="{{isOtp}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; display: flex; flex-direction: column; padding: 14px 28px 32px; gap: 24px">
<button aria-label="Back" onClick="{{goLogin}}" style="width: 44px; height: 44px; margin-left: -12px; border: 0; background: transparent; color: #2A1A2E; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 30px; font-weight: 700">Enter code</h1>
<p style="margin: 0; color: #6E5E6A; font-size: 15px; line-height: 1.5">Sent by SMS to +91 {{phoneShown}}</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="otp" style="font-weight: 600; font-size: 14px">6-digit code</label>
<input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="••••••" value="{{otp}}" onChange="{{onOtp}}" style="height: 60px; border: 1px solid #D9C7CF; border-radius: 14px; background: #FFFFFF; padding: 0 18px; font-size: 26px; letter-spacing: 14px; outline: none; box-sizing: border-box">
<p style="margin: 0; color: #6E5E6A; font-size: 13px">Didn't get it? Resend in 0:28</p>
</div>
<button onClick="{{verify}}" style="height: 54px; border: 0; border-radius: 14px; background: #B83A63; color: #FFFFFF; font-size: 16px; font-weight: 700">Verify &amp; continue</button>
</div>
</sc-if>

<sc-if value="{{isHome}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; padding: 20px 20px 24px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="color: #6E5E6A; font-size: 14px">Good afternoon,</span>
<span style="font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 700">Priya</span>
</div>
<button onClick="{{logout}}" style="height: 40px; padding: 0 14px; border: 1px solid #D9C7CF; border-radius: 12px; background: #FFFFFF; color: #2A1A2E; font-weight: 700; font-size: 13px">Log out</button>
</div>
<div style="background: #5B2A5E; color: #FFFFFF; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 13px; color: #EBD5E0; font-weight: 600; letter-spacing: 0.4px">YOUR NEXT APPOINTMENT</span>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Outfit', sans-serif; font-size: 21px; font-weight: 600">{{nextAppt.title}}</span>
<span style="font-size: 14px; color: #EBD5E0">{{nextAppt.when}}</span>
</div>
<button onClick="{{tabHistory}}" style="align-self: flex-start; height: 40px; padding: 0 16px; border: 1px solid #A783A6; background: transparent; color: #FFFFFF; border-radius: 12px; font-weight: 600; font-size: 14px">View details</button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button onClick="{{tabBook}}" style="border: 1px solid #EADDE3; background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; text-align: left; color: #2A1A2E">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #FBEFF3; color: #B83A63; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>
<span style="font-weight: 700; font-size: 15px">Book appointment</span>
<span style="font-size: 13px; color: #6E5E6A; margin-top: -10px">Makeup &amp; nails</span>
</button>
<button onClick="{{tabShop}}" style="border: 1px solid #EADDE3; background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; text-align: left; color: #2A1A2E">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #FBEFF3; color: #B83A63; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg></span>
<span style="font-weight: 700; font-size: 15px">Shop press-ons</span>
<span style="font-size: 13px; color: #6E5E6A; margin-top: -10px">Delivered home</span>
</button>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 19px; font-weight: 600">Offers for you</h2>
<button onClick="{{goOffers}}" style="border: 0; background: transparent; color: #B83A63; font-weight: 700; font-size: 14px; min-height: 44px; padding: 0 4px">See all</button>
</div>
<sc-if value="{{hasOffers}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 12px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 4px">
<sc-for list="{{offers}}" as="item" hint-placeholder-count="3">
<div style="flex: 0 0 240px; background: #FBEFF3; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 700; color: #8E2A4B">{{item.big}}</span>
<sc-if value="{{item.isNew}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 700; background: #5B2A5E; color: #FFFFFF; border-radius: 6px; padding: 3px 7px">NEW</span></sc-if>
</div>
<span style="font-weight: 700">{{item.title}}</span>
<span style="font-size: 13px; color: #6E5E6A; line-height: 1.4">{{item.desc}}</span>
<span style="align-self: flex-start; margin-top: 4px; border: 1px dashed #B83A63; color: #8E2A4B; border-radius: 8px; padding: 4px 10px; font-weight: 700; font-size: 13px; letter-spacing: 0.5px">{{item.code}}</span>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{noOffers}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px dashed #D9C7CF; border-radius: 18px; padding: 18px; color: #6E5E6A; font-size: 14px; text-align: center">No offers right now. We'll message you on WhatsApp when the next one goes live.</div>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 19px; font-weight: 600">New press-on drops</h2>
<button onClick="{{tabShop}}" style="border: 0; background: transparent; color: #B83A63; font-weight: 700; font-size: 14px; min-height: 44px; padding: 0 4px">Shop</button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{featured}}" as="item" hint-placeholder-count="2">
<button onClick="{{tabShop}}" style="border: 1px solid #EADDE3; background: #FFFFFF; border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 8px; text-align: left; color: #2A1A2E">
<div style="height: 96px; border-radius: 12px; background: {{item.bg}}; display: flex; align-items: flex-end; justify-content: center; gap: 8px; padding-bottom: 14px; box-sizing: border-box">
<div style="width: 22px; height: 50px; border-radius: 11px 11px 6px 6px; background: {{item.c1}}; border: 1px solid {{item.edge}}"></div>
<div style="width: 24px; height: 60px; border-radius: 12px 12px 6px 6px; background: {{item.c2}}; border: 1px solid {{item.edge}}"></div>
<div style="width: 22px; height: 50px; border-radius: 11px 11px 6px 6px; background: {{item.c1}}; border: 1px solid {{item.edge}}"></div>
</div>
<span style="font-weight: 700; font-size: 14px; padding: 0 4px">{{item.name}}</span>
<span style="font-size: 13px; color: #6E5E6A; padding: 0 4px 4px">{{item.priceText}}</span>
</button>
</sc-for>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{isOffers}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 6px; padding: 14px 12px 6px">
<button aria-label="Back" onClick="{{tabHome}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: #2A1A2E; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 600">Offers &amp; discounts</h1>
</div>
<div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 8px 20px 24px">
<sc-if value="{{noOffers}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px dashed #D9C7CF; border-radius: 18px; padding: 18px; color: #6E5E6A; font-size: 14px; text-align: center">No offers right now. Check back soon.</div>
</sc-if>
<sc-for list="{{offers}}" as="item" hint-placeholder-count="3">
<div style="background: #FFFFFF; border: 1px solid #EADDE3; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 36px; height: 36px; border-radius: 10px; background: #FBEFF3; color: #B83A63; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg></span>
<span style="font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 700; color: #8E2A4B">{{item.big}}</span>
</div>
<span style="font-weight: 700; font-size: 16px">{{item.title}}</span>
<span style="font-size: 14px; color: #6E5E6A; line-height: 1.45">{{item.desc}}</span>
<div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #F1E6EB; padding-top: 12px; margin-top: 2px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 700; letter-spacing: 0.6px">{{item.code}}</span>
<span style="font-size: 12px; color: #6E5E6A">{{item.valid}}</span>
</div>
<button onClick="{{item.copy}}" style="height: 40px; padding: 0 14px; border: 1px solid #B83A63; background: #FFFFFF; color: #8E2A4B; border-radius: 12px; font-weight: 700; font-size: 14px">{{item.copyLabel}}</button>
</div>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isBook}}" hint-placeholder-val="{{ false }}">
<div style="padding: 20px 20px 8px">
<h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 700">Book appointment</h1>
</div>
<div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; padding: 8px 20px 20px">
<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 700; color: #5B4A57; letter-spacing: 0.4px">1 · CHOOSE A SERVICE</h2>
<sc-for list="{{services}}" as="item" hint-placeholder-count="5">
<button onClick="{{item.pick}}" style="display: flex; align-items: center; gap: 12px; border-radius: 16px; padding: 14px; text-align: left; color: #2A1A2E; {{item.cardStyle}}">
<span style="width: 20px; height: 20px; border-radius: 10px; box-sizing: border-box; flex: 0 0 20px; {{item.dotStyle}}"></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 700">{{item.name}}</span>
<span style="font-size: 13px; color: #6E5E6A">{{item.dur}}</span>
</span>
<span style="font-weight: 700">{{item.priceText}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 700; color: #5B4A57; letter-spacing: 0.4px">2 · PICK A DATE · OCTOBER</h2>
<div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 2px">
<sc-for list="{{dates}}" as="item" hint-placeholder-count="7">
<button onClick="{{item.pick}}" style="flex: 0 0 54px; height: 68px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; {{item.style}}">
<span style="font-size: 12px; font-weight: 600">{{item.d}}</span>
<span style="font-size: 19px; font-weight: 700">{{item.n}}</span>
</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 700; color: #5B4A57; letter-spacing: 0.4px">3 · PICK A TIME</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{slots}}" as="item" hint-placeholder-count="6">
<button onClick="{{item.pick}}" disabled="{{item.disabled}}" aria-label="{{item.aria}}" style="height: 46px; border-radius: 12px; font-weight: 600; font-size: 14px; {{item.style}}">{{item.t}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="notes" style="font-size: 14px; font-weight: 700; color: #5B4A57; letter-spacing: 0.4px">NOTES FOR THE ARTIST (OPTIONAL)</label>
<textarea id="notes" rows="3" placeholder="Skin type, nail length, design ideas…" style="border: 1px solid #D9C7CF; border-radius: 14px; padding: 12px 14px; font-size: 15px; resize: none; background: #FFFFFF; outline: none"></textarea>
</div>
</div>
<div style="border-top: 1px solid #EADDE3; background: #FFFFFF; padding: 12px 20px; display: flex; align-items: center; gap: 12px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #6E5E6A">{{bookSummary}}</span>
<span style="font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 20px">{{bookTotal}}</span>
</div>
<button onClick="{{toPayBooking}}" disabled="{{bookDisabled}}" style="height: 50px; padding: 0 20px; border: 0; border-radius: 14px; font-weight: 700; font-size: 15px; {{bookCta}}">Continue to pay</button>
</div>
</sc-if>

<sc-if value="{{isShop}}" hint-placeholder-val="{{ false }}">
<div style="padding: 20px 20px 8px; display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 700">Press-on nails</h1>
<span style="font-size: 13px; color: #6E5E6A">Sizing kit included</span>
</div>
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 8px 20px 20px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{products}}" as="item" hint-placeholder-count="6">
<div style="border: 1px solid #EADDE3; background: #FFFFFF; border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 6px">
<div style="height: 104px; border-radius: 12px; background: {{item.bg}}; display: flex; align-items: flex-end; justify-content: center; gap: 8px; padding-bottom: 16px; box-sizing: border-box">
<div style="width: 22px; height: 52px; border-radius: 11px 11px 6px 6px; background: {{item.c1}}; border: 1px solid {{item.edge}}"></div>
<div style="width: 24px; height: 62px; border-radius: 12px 12px 6px 6px; background: {{item.c2}}; border: 1px solid {{item.edge}}"></div>
<div style="width: 22px; height: 52px; border-radius: 11px 11px 6px 6px; background: {{item.c1}}; border: 1px solid {{item.edge}}"></div>
</div>
<span style="font-weight: 700; font-size: 14px; padding: 2px 4px 0">{{item.name}}</span>
<span style="font-size: 12px; color: #6E5E6A; padding: 0 4px">{{item.shape}}</span>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 0 0 4px">
<span style="font-weight: 700">{{item.priceText}}</span>
<sc-if value="{{item.inCart}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 2px; background: #FBEFF3; border-radius: 12px">
<button aria-label="Remove one" onClick="{{item.remove}}" style="width: 36px; height: 40px; border: 0; background: transparent; color: #8E2A4B; font-size: 20px; font-weight: 700">−</button>
<span style="min-width: 16px; text-align: center; font-weight: 700">{{item.qty}}</span>
<button aria-label="Add one" onClick="{{item.add}}" style="width: 36px; height: 40px; border: 0; background: transparent; color: #8E2A4B; font-size: 20px; font-weight: 700">+</button>
</div>
</sc-if>
<sc-if value="{{item.notInCart}}" hint-placeholder-val="{{ true }}">
<button onClick="{{item.add}}" style="height: 40px; padding: 0 16px; border: 0; background: #2A1A2E; color: #FFFFFF; border-radius: 12px; font-weight: 700; font-size: 14px">Add</button>
</sc-if>
</div>
</div>
</sc-for>
</div>
</div>
<sc-if value="{{hasCart}}" hint-placeholder-val="{{ false }}">
<div style="border-top: 1px solid #EADDE3; background: #FFFFFF; padding: 12px 20px; display: flex; align-items: center; gap: 12px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #6E5E6A">{{cartCountText}}</span>
<span style="font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 20px">{{cartTotalText}}</span>
</div>
<button onClick="{{toPayOrder}}" style="height: 50px; padding: 0 24px; border: 0; border-radius: 14px; background: #B83A63; color: #FFFFFF; font-weight: 700; font-size: 15px">Checkout</button>
</div>
</sc-if>
</sc-if>

<sc-if value="{{isPay}}" hint-placeholder-val="{{ false }}">

      on: o.on ? 'true' : 'false', aria: o.title + (o.on ? ' is live' : ' is paused'),
      stateText: o.on ? 'Showing in app' : 'Hidden from customers',
      stateStyle: o.on ? 'color: #2F6B4F' : 'color: #7D6B77',
      track: o.on ? 'background: #2F6B4F; justify-content: flex-end' : 'background: #C9B9C3; justify-content: flex-start',
      toggle: () => set({ offers: s.offers.map((x) => x.id === o.id ? { ...x, on: !x.on } : x) }) }));

    const addOffer = () => {
      const v = parseInt(String(s.nValue).replace(/[^0-9]/g, ''), 10);
      if (!s.nTitle.trim() || !v) { set({ formError: true }); return; }
      const id = 'n' + (s.offers.length + 1);
      const code = (s.nCode.trim() || s.nTitle.replace(/[^A-Za-z]/g, '').slice(0, 8) + v).toUpperCase();
      const o = { id, title: s.nTitle.trim(), desc: s.nDesc.trim() || 'Limited-time offer from Jeni.', type: s.nType, value: v, code, valid: s.nValid.trim() || '31 Oct', on: true };
      set({ offers: [o, ...s.offers], nTitle: '', nDesc: '', nValue: '', nCode: '', nValid: '', formError: false, justPublished: id });
    };
    const jp = s.offers.find((o) => o.id === s.justPublished);
    const announce = () => {
      if (!jp) return;
      set({ aTab: 'broadcast', sent: false, template: null, bMsg: jp.title + ': ' + bigOf(jp) + '! ' + jp.desc + ' Use code ' + jp.code + ' in the GlamWithJeni app. Valid till ' + jp.valid + '.' });
    };

    const PEOPLE = {
      priya: { name: 'Priya M.', phone: '98765 43210' },
      kavya: { name: 'Kavya R.', phone: '98200 11223' },
      riya: { name: 'Riya P.', phone: '99870 45612' },
      neha: { name: 'Neha G.', phone: '97690 33018' }
    };
    const openThread = (id) => {
      const list = s.threads[id] || [];
      set({ aThread: id, threads: s.threads[id] ? s.threads : { ...s.threads, [id]: [] }, seen: { ...s.seen, [id]: list.length }, aDraft: '', aImg: null, aErr: '' });
    };
    const chatList = Object.keys(s.threads).map((id) => {
      const list = s.threads[id];
      const last = list[list.length - 1];
      const unread = !!(last && last.me && (s.seen[id] || 0) < list.length);
      let preview = 'No messages yet';
      if (last) {
        const body = last.img ? (last.text ? 'Photo · ' + last.text : 'Photo') : last.text;
        preview = (last.me ? '' : 'You: ') + body;
      }
      return { name: PEOPLE[id].name, initial: PEOPLE[id].name[0], time: last ? last.time : '', preview, unread,
        previewStyle: unread ? 'color: #2A1A2E; font-weight: 700' : 'color: #6E5E6A',
        open: () => openThread(id) };
    });
    const feedback = [
      { who: 'riya', stars: 5, text: 'Loved my party makeup, it stayed perfect all night!', time: 'Yesterday' },
      { who: 'neha', stars: 3, text: 'Nails look great but I waited 20 minutes past my slot.', time: 'Mon' }
    ].map((f) => ({ name: PEOPLE[f.who].name, text: f.text, time: f.time,
      starText: '★'.repeat(f.stars) + '☆'.repeat(5 - f.stars),
      reply: () => { set({ aInboxTab: 'chats' }); openThread(f.who); } }));
    const th = s.aThread ? (s.threads[s.aThread] || []) : [];
    const aMsgs = s.aThread ? fmtThread(th, false, PEOPLE[s.aThread].name.split(' ')[0]) : [];
    const aSend = () => {
      const t = s.aDraft.trim();
      if (!s.aThread || (!t && !s.aImg)) return;
      const next = [...th, { me: false, text: t, img: s.aImg, time: 'Just now' }];
      set({ threads: { ...s.threads, [s.aThread]: next }, seen: { ...s.seen, [s.aThread]: next.length }, aDraft: '', aImg: null, aErr: '' });
    };

    return {
      isLogin: screen === 'login', isOtp: screen === 'otp', isHome: screen === 'home', isOffers: screen === 'offers',
      isBook: screen === 'book', isShop: screen === 'shop', isPay: screen === 'pay', isSuccess: screen === 'success',
      isHistory: screen === 'history', isChat: screen === 'chat', isAdmin,
      showTabs: !['login', 'otp', 'pay', 'success', 'admin'].includes(screen),
      phone: s.phone, otp: s.otp,
      phoneShown: s.phone ? s.phone : '98765 43210',
      onPhone: (e) => set({ phone: e.target.value.replace(/[^0-9]/g, '').slice(0, 10) }),
      onOtp: (e) => set({ otp: e.target.value.replace(/[^0-9]/g, '').slice(0, 6) }),
      fillAdmin: () => set({ phone: ADMIN_PHONE }),
      sendOtp: go('otp'), goLogin: go('login'),
      verify: () => set({ screen: s.phone === ADMIN_PHONE ? 'admin' : 'home', otp: '' }),
      logout: () => set({ screen: 'login', phone: '', otp: '' }),
      goOffers: go('offers'),
      tabHome: go('home'), tabBook: go('book'), tabShop: go('shop'), tabHistory: go('history'), tabChat: go('chat'),
      goFeedback: () => set({ screen: 'chat', chatTab: 'fb' }),
      cHome: tabC('home'), cBook: tabC('book'), cShop: tabC('shop'), cHistory: tabC('history'), cChat: tabC('chat'),
      nextAppt, offers, hasOffers: offers.length > 0, noOffers: offers.length === 0, featured: products.slice(0, 2),
      services, dates, slots,
      bookSummary: svc ? (s.slot ? svc.name + ' · ' + date[0] + ' ' + date[1] + ', ' + s.slot : svc.name + ' · pick a time') : 'Choose a service',
      bookTotal: svc ? inr(svc.price) : '₹0',
      bookDisabled: !bookReady, bookCta: bookReady ? ctaOn : ctaOff,
      toPayBooking: () => { if (bookReady) set({ screen: 'pay', payFor: 'booking', applied: null }); },
      products, hasCart: cartCount > 0,
      cartCountText: cartCount + (cartCount === 1 ? ' set' : ' sets') + ' in cart',
      cartTotalText: inr(cartTotal),
      toPayOrder: () => set({ screen: 'pay', payFor: 'order', applied: null }),
      isOrder, payHeading: isOrder ? 'ORDER SUMMARY' : 'BOOKING SUMMARY',
      payLines, payTotalText: inr(payTotal), payOffers, methods, pay,
      payBack: () => set({ screen: isOrder ? 'shop' : 'book' }),
      done: s.done || { heading: '', title: '', detail: '' },
      histAppt: () => set({ histTab: 'appt' }), histOrder: () => set({ histTab: 'order' }),
      histApptStyle: s.histTab === 'appt' ? segOn : segOff, histOrderStyle: s.histTab === 'order' ? segOn : segOff,
      showAppts: s.histTab === 'appt', showOrders: s.histTab === 'order', appts, orders,
      chatMsgs: () => set({ chatTab: 'msgs' }), chatFb: () => set({ chatTab: 'fb' }),
      chatMsgsStyle: s.chatTab === 'msgs' ? segOn : segOff, chatFbStyle: s.chatTab === 'fb' ? segOn : segOff,
      showMsgs: s.chatTab === 'msgs', showFb: s.chatTab === 'fb',
      msgs, draft: s.draft,
      onDraft: (e) => set({ draft: e.target.value }),
      sendMsg: () => {
        const t = s.draft.trim();
        if (!t && !s.cImg) return;
        set({ threads: { ...s.threads, priya: [...(s.threads.priya || []), { me: true, text: t, img: s.cImg, time: 'Just now' }] }, draft: '', cImg: null, cErr: '' });
      },
      cPickImg: pickImg('cImg', 'cErr'), cRemoveImg: () => set({ cImg: null }),
      cHasImg: !!s.cImg, cImg: s.cImg, cHasErr: !!s.cErr, cErr: s.cErr,
      hasViewer: !!s.viewImg, viewImg: s.viewImg, closeViewer: () => set({ viewImg: null }),
      stars, fbOpen: !s.fbSent, fbSent: s.fbSent,
      fbDisabled: s.rating === 0, fbCta: s.rating > 0 ? ctaOn : ctaOff,
      submitFb: () => { if (s.rating > 0) set({ fbSent: true }); },

      aTitle: A_TITLES[s.aTab],
      aToday: s.aTab === 'today', aOrders: s.aTab === 'orders', aBroadcast: s.aTab === 'broadcast', aOffers: s.aTab === 'offers', aInbox: s.aTab === 'inbox',
      aTabToday: at('today'), aTabOrders: at('orders'), aTabBroadcast: at('broadcast'), aTabOffers: at('offers'), aTabInbox: at('inbox'),
      acToday: ac('today'), acOrders: ac('orders'), acBroadcast: ac('broadcast'), acOffers: ac('offers'), acInbox: ac('inbox'),
      today, adminOrders, pendingCount, liveOffers: live.length,
      audiences, templates, audienceText, bMsg: s.bMsg,
      onBMsg: (e) => set({ bMsg: e.target.value }),
      composing: !s.sent, sent: s.sent,
      sendBroadcast: () => set({ sent: true }), newBroadcast: () => set({ sent: false, bImg: null, bImgName: '', bImgErr: '' }),
      hasImg: !!s.bImg, noImg: !s.bImg, bImg: s.bImg, bImgName: s.bImgName, bImgErr: s.bImgErr, hasImgErr: !!s.bImgErr,
      sentWhat: s.bImg ? 'your image and message' : 'your message',
      onImg: (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        if (!/^image\/(jpeg|png)$/.test(f.type)) { set({ bImgErr: 'Please choose a JPG or PNG image.' }); e.target.value = ''; return; }
        if (f.size > 5 * 1024 * 1024) { set({ bImgErr: 'That image is over 5 MB, which is WhatsApp’s limit. Try a smaller one.' }); e.target.value = ''; return; }
        set({ bImg: URL.createObjectURL(f), bImgName: f.name, bImgErr: '' });
        e.target.value = '';
      },
      removeImg: () => set({ bImg: null, bImgName: '', bImgErr: '' }),
      noAdminOffers: s.offers.length === 0,
      hasDeleted: !!s.lastDeleted, deletedTitle: s.lastDeleted ? s.lastDeleted.offer.title : '',
      undoDelete: () => { const d = s.lastDeleted; if (!d) return; const arr = [...s.offers]; arr.splice(Math.min(d.index, arr.length), 0, d.offer); set({ offers: arr, lastDeleted: null }); },
      adminOffers, nTitle: s.nTitle, nDesc: s.nDesc, nValue: s.nValue, nCode: s.nCode, nValid: s.nValid,
      onNTitle: (e) => set({ nTitle: e.target.value, formError: false }),
      onNDesc: (e) => set({ nDesc: e.target.value }),
      onNValue: (e) => set({ nValue: e.target.value.replace(/[^0-9]/g, '').slice(0, 5), formError: false }),
      onNCode: (e) => set({ nCode: e.target.value.toUpperCase().replace(/\s/g, '') }),
      onNValid: (e) => set({ nValid: e.target.value }),
      typePct: () => set({ nType: 'pct' }), typeFlat: () => set({ nType: 'flat' }),
      pctStyle: s.nType === 'pct' ? segOn : segOff, flatStyle: s.nType === 'flat' ? segOn : segOff,
      valuePh: s.nType === 'pct' ? 'e.g. 10' : 'e.g. 300',
      formError: s.formError, addOffer, justPublished: !!jp, announce,
      aInList: !s.aThread, aInThread: !!s.aThread,
      aChatsOn: s.aInboxTab === 'chats', aFbOn: s.aInboxTab === 'fb',
      aShowChats: () => set({ aInboxTab: 'chats' }), aShowFb: () => set({ aInboxTab: 'fb' }),
      aChatsStyle: s.aInboxTab === 'chats' ? segOn : segOff, aFbStyle: s.aInboxTab === 'fb' ? segOn : segOff,
      chatList, feedback,
      aCloseThread: () => set({ aThread: null }),
      aThreadName: s.aThread ? PEOPLE[s.aThread].name : '', aThreadInitial: s.aThread ? PEOPLE[s.aThread].name[0] : '',
      aThreadPhone: s.aThread ? PEOPLE[s.aThread].phone : '',
      aThreadEmpty: !!s.aThread && th.length === 0, aMsgs,
      aDraft: s.aDraft, onADraft: (e) => set({ aDraft: e.target.value }), aSend,
      aPickImg: pickImg('aImg', 'aErr'), aRemoveImg: () => set({ aImg: null }),
      aHasImg: !!s.aImg, aImg: s.aImg, aHasErr: !!s.aErr, aErr: s.aErr
    };
  }
}
</script>
</body>
</html>
